<!DOCTYPE html>
<html lang="it" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ MerON - Podcast con Meron</title>

    <!-- PWA Config -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MerON">
    <link rel="apple-touch-icon" href="/logo.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes spin-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-vinyl { animation: spin-vinyl 12s linear infinite; }
        .paused-vinyl { animation-play-state: paused; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-36 transition-colors duration-300" onload="initApp()">

    <!-- HEADER -->
    <header class="bg-white/90 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm backdrop-blur-md py-2 transition-colors">
        <div class="w-full px-4 sm:px-8 grid grid-cols-3 items-center">
            <div class="flex items-center gap-2">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-amber-400 hover:scale-105 transition shadow-sm text-sm font-semibold flex items-center gap-2">
                    <span id="theme-icon">🌙</span>
                    <span id="theme-text" class="hidden md:inline text-xs">Dark Mode</span>
                </button>
            </div>
            <div class="flex flex-col items-center justify-center text-center">
                <img src="/logo.png" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=MerON';" alt="MerON Logo" class="h-16 sm:h-20 w-auto object-contain drop-shadow-md transition hover:scale-105">
            </div>
            <div class="flex justify-end">
                <span class="text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 font-bold px-3 py-1.5 rounded-full">PWA Ready 🚀</span>
            </div>
        </div>
    </header>

    <!-- BANNER HERO CON RICERCA -->
    <div class="w-full bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 text-white py-8 px-4 sm:px-8 shadow-inner">
        <div class="w-full flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Ascolta, scopri e goditi i tuoi Podcast.</h2>
                <p class="text-indigo-100 text-xs sm:text-sm mt-1">Migliaia di episodi aggiornati in tempo reale su MerON.</p>
            </div>
            <div class="w-full md:w-1/2 flex gap-2">
                <input type="text" id="search-input" placeholder="Es. Barbero, Elisa True Crime, Radio Deejay..." onkeydown="if(event.key==='Enter') searchPodcasts()" class="w-full px-4 py-3 rounded-xl bg-white/10 backdrop-blur-md border border-white/20 text-white placeholder-indigo-200 text-sm focus:outline-none focus:bg-white focus:text-slate-900 focus:placeholder-slate-400 transition">
                <button onclick="searchPodcasts()" class="bg-white hover:bg-indigo-50 text-indigo-700 px-6 py-3 rounded-xl font-bold text-sm shadow-lg transition whitespace-nowrap">Cerca</button>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="w-full px-4 sm:px-8 py-6 space-y-8">
        
        <!-- SEZIONE PRINCIPALE PODCAST -->
        <div class="space-y-6">
            
            <!-- PREFERITI -->
            <div id="favorites-section" class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
                <h3 class="text-sm font-bold text-amber-500 mb-2 flex items-center gap-1.5">❤️ <span class="text-slate-800 dark:text-slate-100">I Tuoi Preferiti</span></h3>
                <div id="favorites-list" class="flex gap-3 overflow-x-auto no-scrollbar py-1">
                    <p class="text-slate-400 dark:text-slate-500 text-xs">Nessun preferito salvato.</p>
                </div>
            </div>

            <!-- GRIGLIA PODCAST -->
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
                <h3 id="results-title" class="text-base font-extrabold text-slate-900 dark:text-slate-100 mb-4">🔥 Top Podcast del Momento</h3>
                <div id="search-results" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>

            <!-- EPISODI SELEZIONATI -->
            <div id="episodes-container" class="hidden bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-md border border-indigo-200 dark:border-slate-700 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                    <h3 id="selected-podcast-title" class="text-base font-bold text-indigo-600 dark:text-indigo-400 truncate"></h3>
                    <button onclick="closeEpisodes()" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-lg">✕ Chiudi</button>
                </div>
                <div id="episodes-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[400px] overflow-y-auto pr-1"></div>
            </div>

        </div>

    </main>

    <!-- MODALE VINILE -->
    <div id="vinyl-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl transition-all duration-500 overflow-hidden">
        <div id="vinyl-bg-blur" class="absolute inset-0 bg-cover bg-center blur-3xl opacity-40 scale-125 transition-all duration-700 pointer-events-none"></div>
        <button onclick="closeVinylModal()" class="absolute top-6 left-6 z-20 w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center backdrop-blur-md transition">✕</button>
        
        <div class="relative z-10 flex flex-col items-center justify-center max-w-sm w-full text-center space-y-6">
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
                <div id="vinyl-disc" class="w-full h-full rounded-full bg-slate-950 shadow-2xl border-4 border-slate-800/60 flex items-center justify-center relative animate-vinyl paused-vinyl transition-all" style="background: radial-gradient(circle, #1e293b 0%, #0f172a 35%, #020617 70%, #000 100%);">
                    <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full overflow-hidden border-2 border-slate-700 shadow-inner flex items-center justify-center relative">
                        <img id="vinyl-img" src="/logo.png" onerror="this.src='https://via.placeholder.com/150?text=MerON'" class="w-full h-full object-cover">
                        <div class="absolute w-4 h-4 rounded-full bg-slate-900 border border-slate-600 shadow-md"></div>
                    </div>
                </div>
            </div>

            <div class="space-y-1 px-4">
                <h2 id="vinyl-title" class="text-xl sm:text-2xl font-black text-white leading-tight drop-shadow-md">Titolo Episodio</h2>
                <p id="vinyl-author" class="text-xs sm:text-sm font-semibold text-slate-300 drop-shadow">Autore Podcast</p>
            </div>

            <div class="w-full px-2 space-y-1">
                <input type="range" id="vinyl-seekbar" min="0" value="0" step="0.1" oninput="seekAudio(this.value)" class="w-full h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                <div class="flex justify-between text-[10px] text-slate-300 font-mono">
                    <span id="vinyl-current-time">0:00</span>
                    <span id="vinyl-duration-time">0:00</span>
                </div>
            </div>

            <div class="flex items-center justify-between bg-white/10 px-5 py-3 rounded-2xl backdrop-blur-md border border-white/10 shadow-xl w-full">
                <button onclick="skipTime(-15)" class="text-white hover:text-indigo-300 text-sm font-bold p-1">⏪ -15s</button>
                <button id="vinyl-play-btn" onclick="togglePlayPause()" class="w-12 h-12 bg-white text-slate-900 rounded-full flex items-center justify-center text-xl font-black shadow-lg hover:scale-110 active:scale-95 transition">▶</button>
                <button onclick="skipTime(15)" class="text-white hover:text-indigo-300 text-sm font-bold p-1">+15s ⏩</button>
            </div>
        </div>
    </div>

    <!-- PLAYER FISSO IN BASSO -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 p-3 shadow-2xl z-40">
        <div class="w-full px-2 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3 w-full md:w-1/4 cursor-pointer" onclick="openVinylModal()">
                <img id="player-img" src="/logo.png" onerror="this.src='https://via.placeholder.com/150?text=MerON'" class="w-12 h-12 rounded-xl object-cover shadow-sm border border-slate-200 dark:border-slate-700 flex-shrink-0">
                <div class="truncate">
                    <p id="player-title" class="font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-100 truncate">Seleziona un episodio</p>
                    <p id="player-subtitle" class="text-[11px] text-slate-400 truncate">Clicca per schermata vinile 🎵</p>
                </div>
            </div>

            <audio id="global-player" controls class="w-full md:w-1/2 h-10"></audio>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Registrazione Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
        }

        const player = document.getElementById('global-player');
        const playerTitle = document.getElementById('player-title');
        const playerImg = document.getElementById('player-img');
        const vinylModal = document.getElementById('vinyl-modal');
        const vinylDisc = document.getElementById('vinyl-disc');
        const vinylImg = document.getElementById('vinyl-img');
        const vinylBgBlur = document.getElementById('vinyl-bg-blur');
        const vinylTitle = document.getElementById('vinyl-title');
        const vinylAuthor = document.getElementById('vinyl-author');
        const vinylPlayBtn = document.getElementById('vinyl-play-btn');
        const vinylSeekbar = document.getElementById('vinyl-seekbar');
        const vinylCurrentTime = document.getElementById('vinyl-current-time');
        const vinylDurationTime = document.getElementById('vinyl-duration-time');

        let favorites = JSON.parse(localStorage.getItem('meron_favs')) || [];

        function initApp() {
            if (localStorage.getItem('meron_theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
            renderFavorites();
            loadTopPodcasts();

            player.addEventListener('play', () => {
                vinylDisc.classList.remove('paused-vinyl');
                vinylPlayBtn.innerText = '⏸';
            });
            player.addEventListener('pause', () => {
                vinylDisc.classList.add('paused-vinyl');
                vinylPlayBtn.innerText = '▶';
            });
            player.addEventListener('timeupdate', () => {
                if (!isNaN(player.duration)) {
                    vinylSeekbar.max = player.duration;
                    vinylSeekbar.value = player.currentTime;
                    vinylCurrentTime.innerText = formatTime(player.currentTime);
                    vinylDurationTime.innerText = formatTime(player.duration);
                }
            });
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function togglePlayPause() { player.paused ? player.play() : player.pause(); }
        function seekAudio(v) { player.currentTime = v; }
        function skipTime(s) { player.currentTime += s; }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('meron_theme', html.classList.contains('dark') ? 'dark' : 'light');
        }

        async function loadTopPodcasts() {
            showSkeleton();
            const res = await fetch('/api/top-podcasts');
            const data = await res.json();
            renderPodcasts(data, "🔥 Top Podcast del Momento");
        }

        async function searchPodcasts() {
            const q = document.getElementById('search-input').value;
            if(!q) return;
            showSkeleton();
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            renderPodcasts(data, `🔍 Risultati per: "${q}"`);
        }

        function renderPodcasts(items, title) {
            document.getElementById('results-title').innerText = title;
            const c = document.getElementById('search-results');
            c.innerHTML = '';
            if(!items || items.length === 0) {
                c.innerHTML = '<p class="text-xs text-slate-400">Nessun podcast trovato.</p>';
                return;
            }
            items.forEach(item => {
                const isFav = favorites.some(f => f.id === item.id);
                const div = document.createElement('div');
                div.className = 'p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700 flex flex-col justify-between hover:scale-[1.02] transition shadow-sm';
                div.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer" onclick="loadEpisodes('${item.id}', '${item.title.replace(/'/g, "\\'")}')">
                        <img src="${item.image}" class="w-14 h-14 rounded-lg object-cover">
                        <div class="truncate">
                            <h4 class="font-bold text-xs dark:text-white truncate">${item.title}</h4>
                            <p class="text-[10px] text-slate-400 truncate">${item.artist}</p>
                        </div>
                    </div>
                    <div class="mt-3 flex justify-between items-center border-t border-slate-200/40 dark:border-slate-800 pt-2">
                        <button onclick="loadEpisodes('${item.id}', '${item.title.replace(/'/g, "\\'")}')" class="text-xs font-bold text-indigo-600 dark:text-indigo-400">Episodi ➔</button>
                        <button onclick="toggleFav('${item.id}', '${item.title.replace(/'/g, "\\'")}', '${item.image}')" class="text-sm">${isFav ? '❤️' : '🤍'}</button>
                    </div>
                `;
                c.appendChild(div);
            });
        }

        async function loadEpisodes(id, title) {
            const container = document.getElementById('episodes-container');
            const list = document.getElementById('episodes-list');
            document.getElementById('selected-podcast-title').innerText = title;
            list.innerHTML = '<p class="text-xs text-slate-400 col-span-full">Caricamento episodi...</p>';
            container.classList.remove('hidden');
            container.scrollIntoView({ behavior: 'smooth' });

            const res = await fetch(`/api/podcast-details?id=${id}`);
            const data = await res.json();
            list.innerHTML = '';

            if(!data.episodes || data.episodes.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400">Nessun episodio trovato.</p>';
                return;
            }

            data.episodes.forEach(ep => {
                if(!ep.audio_url) return;
                const div = document.createElement('div');
                div.className = 'p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center';
                div.innerHTML = `
                    <div class="truncate max-w-[80%]">
                        <p class="font-bold text-xs text-slate-800 dark:text-slate-200 truncate">${ep.title}</p>
                        <p class="text-[10px] text-slate-400">${ep.published ? ep.published.slice(0, 16) : ''}</p>
                    </div>
                    <button onclick="playAudio('${ep.audio_url}', '${ep.title.replace(/'/g, "\\'")}', '${data.image}', '${data.artist.replace(/'/g, "\\'")}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">▶ Ascolta</button>
                `;
                list.appendChild(div);
            });
        }

        function playAudio(url, title, img, author) {
            player.src = url;
            playerTitle.innerText = title;
            playerImg.src = img;
            vinylTitle.innerText = title;
            vinylAuthor.innerText = author;
            vinylImg.src = img;
            vinylBgBlur.style.backgroundImage = `url('${img}')`;
            player.play();
            openVinylModal();
        }

        function openVinylModal() { if(player.src) vinylModal.classList.remove('hidden'); }
        function closeVinylModal() { vinylModal.classList.add('hidden'); }
        function closeEpisodes() { document.getElementById('episodes-container').classList.add('hidden'); }

        function toggleFav(id, title, image) {
            const idx = favorites.findIndex(f => f.id === id);
            if(idx > -1) { favorites.splice(idx, 1); }
            else { favorites.push({id, title, image}); }
            localStorage.setItem('meron_favs', JSON.stringify(favorites));
            renderFavorites();
            loadTopPodcasts();
        }

        function renderFavorites() {
            const c = document.getElementById('favorites-list');
            if(favorites.length === 0) {
                c.innerHTML = '<p class="text-slate-400 text-xs">Nessun preferito salvato.</p>';
                return;
            }
            c.innerHTML = '';
            favorites.forEach(f => {
                const div = document.createElement('div');
                div.className = 'flex-shrink-0 flex items-center gap-2 p-1.5 bg-slate-100 dark:bg-slate-700 rounded-xl cursor-pointer';
                div.onclick = () => loadEpisodes(f.id, f.title);
                div.innerHTML = `
                    <img src="${f.image}" class="w-8 h-8 rounded-lg object-cover">
                    <span class="text-xs font-bold dark:text-white max-w-[100px] truncate">${f.title}</span>
                `;
                c.appendChild(div);
            });
        }

        function showSkeleton() {
            const c = document.getElementById('search-results');
            c.innerHTML = '<p class="text-xs text-slate-400">Caricamento in corso...</p>';
        }
    </script>
</body>
</html>
